# ============================================================
# zjtec-admin · 数据库连接配置（配置外置）
# ============================================================
# 为什么单独放一个文件，而不是写在 XML 里？
#   1) 改密码只动这一个文件，不用在 XML 里翻找
#   2) 换数据库（本机测试 → 机房服务器）只改这一处
#   3) 密码不会跟着 XML 一起被提交/发给别人
#
# 【启用时机】
#   P4（MyBatis）：MyBatis 的 mybatis-config.xml 里用 ${jdbc.url} 读取
#   P5（SSM 整合）：由 Spring 的 <context:property-placeholder> 读取
#   P3（现在）   ：文件已就位，但还没有人读它 —— 启动自检会提示"已就位，待启用"
#
# 【注意】properties 文件里的 & 直接写，不用写成 &amp;
#        （这与 XML 不同 —— XML 里才需要转义）
# ============================================================

jdbc.driver=com.mysql.cj.jdbc.Driver

# 库名 db_ssm：与实验指导书 P4 建库脚本一致
# 参数说明：
#   useUnicode + characterEncoding=utf8   → 中文不乱码
#   serverTimezone=Asia/Shanghai          → 避免时区报错
#   useSSL=false                          → 实验室环境免证书
#   allowPublicKeyRetrieval=true          → MySQL 8.4 默认 caching_sha2_password 的常见坑
jdbc.url=jdbc:mysql://localhost:3306/db_ssm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

jdbc.username=root
jdbc.password=你的密码
